<!DOCTYPE html>
<html>
<head>
    <script>
        window.onload = function() {
            let randomNum = Math.floor(Math.random() * 1000000); // Generates a random number
            let newUrl = `https://${randomNum}.lrga.space/browser?q=https://www.totaljerkface.com/`;
            window.location.href = newUrl; // Redirects to the new URL
        };
    </script>
    <title>Redirecting...</title>
</head>
<body>
    <p>If you are not redirected automatically, click <a id="redirect-link" href="#">here</a>.</p>
    <script>
        document.getElementById("redirect-link").onclick = function() {
            let randomNum = Math.floor(Math.random() * 1000000);
            this.href = `https://${randomNum}.lrga.space/browser?q=https://www.totaljerkface.com/`;
        };
    </script>
</body>
</html>
